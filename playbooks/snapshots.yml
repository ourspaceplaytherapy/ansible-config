---

- name: add snapshots cronjob
  hosts: server
  become: true
  tasks:
  - name: add cronjobs dir
    ansible.builtin.file:
      path: '{{ item }}'
      state: directory
      mode: '0755'
    loop:
      - '/root/cronjobs'
      - '/etc/cron.d'
  - name: add snapshots script
    ansible.builtin.template:
      src: '../templates/root/cronjobs/snapshots.sh'
      dest: '/root/cronjobs/snapshots.sh'
      owner: root
      group: wheel
      mode: '0755'
  - name: add cronjob
    ansible.builtin.template:
      src: '../templates/cron.d/snapshots'
      dest: '/etc/cron.d/snapshots'
      owner: root
      group: wheel
      mode: '0644'
